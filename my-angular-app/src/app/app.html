<div class="app-container" [class.light-mode]="!isDarkMode()">

  <div class="top-bar">
    <div>
      <span style="font-weight: 600;">Cloudflare Workers AI Assistant</span>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
      <button
        class="btn-toggle"
        (click)="toggleTheme()"
        [title]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (isDarkMode()) {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        } @else {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
        }
      </button>
      <button class="btn-toggle" (click)="clearHistory()">
        Clear Chat
      </button>
    </div>
  </div>

  <div class="chat-container" #scrollContainer>
    <div class="message-wrapper">
      
      @if (chatHistory().length === 0 && !isProcessing()) {
        <div style="text-align: center; margin-top: 20vh;">
          <h2 class="empty-state-heading">How can I help you today?</h2>
        </div>
      }

      @for (msg of chatHistory(); track $index) {
        <div class="message-row" [class]="msg.role === 'user' ? 'user' : 'ai'">
          
          @if (msg.role !== 'user') {
            <div style="width: 28px; height: 28px; border-radius: 50%; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; margin-top: 8px;">
              AI
            </div>
          }

          <div class="bubble" [class]="msg.role === 'user' ? 'user' : 'ai'">
            @if (msg.role === 'user') {
              <span>{{ msg.content }}</span>
            } @else {
              <div class="markdown-content" [innerHTML]="renderMarkdown(msg.content)"></div>
            }
          </div>
          
        </div>
      }
    </div>
  </div>

  <div class="input-container">
    <div class="input-box">
      
      <textarea 
        #textInput
        [(ngModel)]="textPrompt" 
        rows="1" 
        [placeholder]="status()"
        (keyup.enter)="submitText()"
        [disabled]="isProcessing() || isRecording()">
      </textarea>

      <button 
        class="action-btn btn-mic" 
        [class.recording]="isRecording()"
        (click)="toggleRecording()"
        [disabled]="isProcessing()"
        title="Ask via Voice">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>

      <button 
        class="action-btn btn-send" 
        (click)="submitText()"
        [disabled]="isProcessing() || (!textPrompt().trim() && !isRecording())"
        title="Send Message">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>

    </div>
  </div>
</div>
